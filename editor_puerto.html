<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definidor de Bloques y Bahías - DP World</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
        h1 { text-align: center; color: #003366; margin-bottom: 3px; font-size: 22px; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; font-size: 13px; }
        .container { display: flex; gap: 20px; max-width: 1500px; margin: 0 auto; }
        .croquis-canvas { flex: 4; background: #eef2f7; border: 2px solid #ccc; border-radius: 8px; position: relative; height: 750px; overflow: auto; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .muelle-banner { position: absolute; top: 10px; left: 10px; right: 10px; background-color: #003366; color: white; text-align: center; padding: 10px; font-weight: bold; border-radius: 4px; z-index: 1; font-size: 14px; letter-spacing: 1px; }
        .bloque-item { position: absolute; border-radius: 6px; padding: 8px; cursor: move; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; user-select: none; }
        .bloque-item.reefer { background-color: #cce5ff; border: 2px solid #004085; color: #004085; }
        .bloque-item.estandar { background-color: #e2e3e5; border: 2px solid #383d41; color: #383d41; }
        .bloque-item.servicio { background-color: #d4edda; border: 2px solid #155724; color: #155724; }
        .bloque-item.coldchamber { background-color: #fff3cd; border: 2px solid #856404; color: #856404; }
        .bloque-item span { font-size: 12px; font-weight: bold; pointer-events: none; }
        .bloque-item small { font-size: 9px; pointer-events: none; margin-top: 2px; }
        .bloque-item.seleccionado { border: 2px dashed #ff9800 !important; box-shadow: 0 0 8px rgba(255, 152, 0, 0.6); }
        .resize-handle { position: absolute; width: 10px; height: 10px; background: #ff9800; border: 1px solid #fff; display: none; z-index: 10; }
        .bloque-item.seleccionado .resize-handle { display: block; }
        .handle-se { bottom: -5px; right: -5px; cursor: se-resize; }
        .handle-sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .handle-ne { top: -5px; right: -5px; cursor: ne-resize; }
        .handle-nw { top: -5px; left: -5px; cursor: nw-resize; }
        .panel-control { flex: 1.2; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-height: 750px; overflow-y: auto; }
        .panel-control h3 { margin-top: 0; color: #003366; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 12px; }
        .form-group input, .form-group select { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .btn { background-color: #003366; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; font-size: 12px; }
        .btn:hover { background-color: #002244; }
        .btn-danger { background-color: #dc3545; }
        .btn-secundario { background-color: #6c757d; }
        .btn-success { background-color: #28a745; }
    </style>
</head>
<body>

    <h1>Diseñador de Bloques y Bahías - DP World</h1>
    <p class="subtitle">Diseña tu puerto, ajusta las bahías y guarda para sincronizar automáticamente con la pantalla de personal.</p>

    <div class="container">
        <div class="croquis-canvas" id="canvas">
            <div class="muelle-banner">MUELLE / ZONA DE ATRAQUE (DP World Posorja - 700m/800m)</div>
        </div>

        <div class="panel-control">
            <h3>Propiedades del Elemento</h3>
            <div id="infoEdicion">
                <p style="font-size: 12px; color: #666;">Selecciona un bloque para configurar sus bahías y sentido.</p>
            </div>
            
            <div id="formularioEdicion" style="display: none;">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Nombre:</label><input type="text" id="editNombre" oninput="actualizarDesdeInputs()"></div>
                <div class="form-group">
                    <label>Tipo de Zona:</label>
                    <select id="editTipo" onchange="actualizarDesdeInputs()">
                        <option value="estandar">Bloque Estándar</option>
                        <option value="reefer">Bloque Reefer</option>
                        <option value="coldchamber">Cold Chamber (CC)</option>
                        <option value="servicio">Zona de Aforo / Servicio (S1, S2)</option>
                    </select>
                </div>
                <div class="form-group"><label>Bahía Inicial (Ej: 92):</label><input type="number" id="editBayInicio" oninput="actualizarDesdeInputs()"></div>
                <div class="form-group"><label>Bahía Final (Ej: 48):</label><input type="number" id="editBayFin" oninput="actualizarDesdeInputs()"></div>
                <div class="form-group">
                    <label>Sentido:</label>
                    <select id="editSentido" onchange="actualizarDesdeInputs()">
                        <option value="izq-der">Izquierda a Derecha</option>
                        <option value="der-izq">Derecha a Izquierda</option>
                        <option value="arriba-abajo">Arriba hacia Abajo (Vertical)</option>
                    </select>
                </div>
                <button class="btn btn-danger" onclick="eliminarBloqueSelected()">Eliminar Elemento</button>
            </div>

            <hr style="margin: 15px 0;">
            <button class="btn btn-secundario" onclick="agregarBloque()">+ Añadir Nuevo Bloque</button>
            <button class="btn btn-success" onclick="guardarYIrAPersonal()">💾 Guardar e Ir a Control de Personal</button>
        </div>
    </div>

    <script>
        let bloques = JSON.parse(localStorage.getItem('puerto_bloques')) || [
            { id: 1, nombre: "Bloque I (Reefer)", tipo: "reefer", x: 30, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: ["Carlos Mendoza"] },
            { id: 2, nombre: "Bloque H (Reefer)", tipo: "reefer", x: 175, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: [] },
            { id: 3, nombre: "Bloque G", tipo: "estandar", x: 320, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: [] },
            { id: 4, nombre: "Bloque F", tipo: "estandar", x: 465, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: [] },
            { id: 5, nombre: "Bloque E", tipo: "estandar", x: 610, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: [] },
            { id: 6, nombre: "Bloque D", tipo: "estandar", x: 755, y: 70, ancho: 130, alto: 100, bayInicio: 92, bayFin: 48, sentido: "izq-der", personal: [] },
            { id: 7, nombre: "Bloque K (Vertical)", tipo: "estandar", x: 910, y: 70, ancho: 110, alto: 220, bayInicio: 1, bayFin: 20, sentido: "arriba-abajo", personal: [] },
            { id: 8, nombre: "Cold Chamber (CC)", tipo: "coldchamber", x: 30, y: 320, ancho: 150, alto: 80, bayInicio: 0, bayFin: 0, sentido: "izq-der", personal: [] },
            { id: 9, nombre: "Zona S1 (Aforo)", tipo: "servicio", x: 195, y: 320, ancho: 140, alto: 80, bayInicio: 0, bayFin: 0, sentido: "izq-der", personal: ["Lic. Fausto Zambrano"] },
            { id: 10, nombre: "Zona S2 (Aforo)", tipo: "servicio", x: 350, y: 320, ancho: 140, alto: 80, bayInicio: 0, bayFin: 0, sentido: "izq-der", personal: [] }
        ];

        let idSeleccionado = null;
        const canvas = document.getElementById("canvas");

        function renderizarCroquis() {
            const banner = canvas.querySelector(".muelle-banner");
            canvas.innerHTML = "";
            canvas.appendChild(banner);

            bloques.forEach(bloque => {
                const div = document.createElement("div");
                div.className = `bloque-item ${bloque.tipo}`;
                if (bloque.id === idSeleccionado) div.classList.add("seleccionado");

                div.style.left = bloque.x + "px";
                div.style.top = bloque.y + "px";
                div.style.width = bloque.ancho + "px";
                div.style.height = bloque.alto + "px";

                let infoBahias = bloque.bayInicio > 0 ? `<small>Bahías: ${bloque.bayInicio} ➔ ${bloque.bayFin}</small>` : `<small>Área de Servicio</small>`;

                div.innerHTML = `
                    <span>${bloque.nombre}</span>
                    ${infoBahias}
                    <div class="resize-handle handle-se" data-handle="se"></div>
                    <div class="resize-handle handle-sw" data-handle="sw"></div>
                    <div class="resize-handle handle-ne" data-handle="ne"></div>
                    <div class="resize-handle handle-nw" data-handle="nw"></div>
                `;

                div.onmousedown = (e) => {
                    if (e.target.classList.contains('resize-handle')) return;
                    iniciarArrastre(e, bloque.id);
                };

                div.querySelectorAll('.resize-handle').forEach(h => {
                    h.onmousedown = (e) => iniciarRedimensionado(e, bloque.id, h.dataset.handle);
                });

                canvas.appendChild(div);
            });
        }

        let modoAccion = null, bloqueActualId = null, startX, startY, initX, initY, initW, initH, resizeHandleType;

        function iniciarArrastre(e, id) {
            e.stopPropagation(); modoAccion = 'drag'; bloqueActualId = id; seleccionarBloque(id);
            startX = e.clientX; startY = e.clientY;
            const b = bloques.find(item => item.id === id);
            initX = b.x; initY = b.y;
        }

        function iniciarRedimensionado(e, id, handleType) {
            e.stopPropagation(); modoAccion = 'resize'; bloqueActualId = id; resizeHandleType = handleType; seleccionarBloque(id);
            startX = e.clientX; startY = e.clientY;
            const b = bloques.find(item => item.id === id);
            initX = b.x; initY = b.y; initW = b.ancho; initH = b.alto;
        }

        document.onmousemove = (e) => {
            if (!modoAccion || bloqueActualId === null) return;
            const b = bloques.find(item => item.id === bloqueActualId);
            const dx = e.clientX - startX, dy = e.clientY - startY;

            if (modoAccion === 'drag') {
                b.x = Math.max(0, initX + dx); b.y = Math.max(50, initY + dy);
            } else if (modoAccion === 'resize') {
                if (resizeHandleType === 'se') { b.ancho = Math.max(60, initW + dx); b.alto = Math.max(50, initH + dy); }
                else if (resizeHandleType === 'sw') { let nw = initW - dx; if (nw >= 60) { b.x = initX + dx; b.ancho = nw; } b.alto = Math.max(50, initH + dy); }
                else if (resizeHandleType === 'ne') { b.ancho = Math.max(60, initW + dx); let nh = initH - dy; if (nh >= 50) { b.y = initY + dy; b.alto = nh; } }
                else if (resizeHandleType === 'nw') { let nw = initW - dx; if (nw >= 60) { b.x = initX + dx; b.ancho = nw; } let nh = initH - dy; if (nh >= 50) { b.y = initY + dy; b.alto = nh; } }
            }
            renderizarCroquis();
        };

        document.onmouseup = () => { modoAccion = null; bloqueActualId = null; };

        function seleccionarBloque(id) {
            idSeleccionado = id;
            const b = bloques.find(item => item.id === id);
            document.getElementById("infoEdicion").style.display = "none";
            document.getElementById("formularioEdicion").style.display = "block";
            document.getElementById("editId").value = b.id;
            document.getElementById("editNombre").value = b.nombre;
            document.getElementById("editTipo").value = b.tipo;
            document.getElementById("editBayInicio").value = b.bayInicio;
            document.getElementById("editBayFin").value = b.bayFin;
            document.getElementById("editSentido").value = b.sentido;
            renderizarCroquis();
        }

        function actualizarDesdeInputs() {
            if (idSeleccionado === null) return;
            const b = bloques.find(item => item.id === idSeleccionado);
            b.nombre = document.getElementById("editNombre").value;
            b.tipo = document.getElementById("editTipo").value;
            b.bayInicio = parseInt(document.getElementById("editBayInicio").value) || 0;
            b.bayFin = parseInt(document.getElementById("editBayFin").value) || 0;
            b.sentido = document.getElementById("editSentido").value;
            renderizarCroquis();
        }

        function agregarBloque() {
            const nuevoId = bloques.length > 0 ? Math.max(...bloques.map(b => b.id)) + 1 : 1;
            bloques.push({ id: nuevoId, nombre: `Bloque ${nuevoId}`, tipo: "estandar", x: 50, y: 420, ancho: 120, alto: 90, bayInicio: 1, bayFin: 20, sentido: "izq-der", personal: [] });
            seleccionarBloque(nuevoId);
        }

        function eliminarBloqueSelected() {
            if (idSeleccionado === null) return;
            bloques = bloques.filter(b => b.id !== idSeleccionado);
            idSeleccionado = null;
            document.getElementById("formularioEdicion").style.display = "none";
            document.getElementById("infoEdicion").style.display = "block";
            renderizarCroquis();
        }

        function guardarYIrAPersonal() {
            localStorage.setItem('puerto_bloques', JSON.stringify(bloques));
            window.location.href = 'personal_puerto.html';
        }

        renderizarCroquis();
    </script>
</body>
</html>
