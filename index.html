<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Bloques y Personal Reefer</title>
  <style>
    :root {
      --bg-primary: #121826;
      --bg-secondary: #1a2332;
      --card-bg: #212d40;
      --accent: #00d2ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ff4757;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1, h2 {
      color: var(--accent);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .grid-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (min-width: 900px) {
      .grid-section {
        grid-template-columns: 1fr 2fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 0.9em;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-main);
      box-sizing: border-box;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text-main); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--bg-secondary);
      color: var(--accent);
    }

    .action-btn {
      padding: 4px 8px;
      font-size: 0.8em;
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Sistema de Control de Operaciones</h1>

  <!-- SECCIÓN BLOQUES -->
  <h2>Gestión de Bloques y Equipos</h2>
  <div class="grid-section">
    <div class="card">
      <h3 id="formBloquesTitle">Agregar Bloque</h3>
      <form id="formBloques">
        <input type="hidden" id="bloqueId">
        <div class="form-group">
          <label>Bloque / Zona</label>
          <input type="text" id="bloqueNombre" required>
        </div>
        <div class="form-group">
          <label>Técnicos (separados por coma)</label>
          <input type="text" id="bloqueTecnicos" required>
        </div>
        <div class="form-group">
          <label>Radios (separados por coma)</label>
          <input type="text" id="bloqueRadios">
        </div>
        <div class="form-group">
          <label>Tablets (separados por coma)</label>
          <input type="text" id="bloqueTablets">
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Guardar</button>
          <button type="button" class="btn-secondary" onclick="cancelarEdicionBloques()">Cancelar</button>
        </div>
      </form>
    </div>

    <div>
      <div style="margin-bottom: 10px; text-align: right;">
        <button class="btn-danger" onclick="limpiarBloques()">Borrar Todos los Bloques</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Bloque</th>
            <th>Técnicos</th>
            <th>Radios</th>
            <th>Tablets</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyBloques"></tbody>
      </table>
    </div>
  </div>

  <!-- SECCIÓN REEFER TEAM -->
  <h2>Personal Reefer</h2>
  <div class="grid-section">
    <div class="card">
      <h3 id="formReeferTitle">Agregar Personal Reefer</h3>
      <form id="formReefer">
        <input type="hidden" id="reeferId">
        <div class="form-group">
          <label>Personal / Grupo</label>
          <input type="text" id="reeferPersonal" required>
        </div>
        <div class="form-group">
          <label>Pedido</label>
          <input type="number" id="reeferPedido" required>
        </div>
        <div class="form-group">
          <label>Asistieron</label>
          <input type="number" id="reeferAsistieron" required>
        </div>
        <div class="form-group">
          <label>Observaciones</label>
          <input type="text" id="reeferObservaciones">
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Guardar</button>
          <button type="button" class="btn-secondary" onclick="cancelarEdicionReefer()">Cancelar</button>
        </div>
      </form>
    </div>

    <div>
      <div style="margin-bottom: 10px; text-align: right;">
        <button class="btn-danger" onclick="limpiarReefer()">Borrar Todo el Personal</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Personal</th>
            <th>Pedido</th>
            <th>Asistieron</th>
            <th>Observaciones</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyReefer"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ==========================================
// PERSISTENCIA Y MANEJO DE ESTADO
// ==========================================

function getStoredBloques() {
  const data = localStorage.getItem("registros_bloques");
  if (data === null) {
    const defaultBloques = [
      { id: 1, bloque: "1D", tecnicos: ["TOCTO", "TORRES"], radios: ["4250"], tablets: ["3", "2"] },
      { id: 2, bloque: "1E", tecnicos: ["CHONILLO", "PÉREZ"], radios: ["Lp", "4329"], tablets: ["4", "5"] },
      { id: 3, bloque: "1F", tecnicos: ["DAMIÁN", "VERA"], radios: ["3456", "2340"], tablets: ["6", "7"] },
      { id: 4, bloque: "1G", tecnicos: ["SÁNCHEZ", "PINEDA"], radios: ["4250"], tablets: ["23", "45"] },
      { id: 5, bloque: "1H", tecnicos: ["VIRIUS", "TERRY"], radios: ["2390", "3450"], tablets: ["34", "67"] },
      { id: 6, bloque: "1I", tecnicos: ["TERRY", "TOREWS"], radios: ["3260", "5634"], tablets: ["12", "11"] },
      { id: 7, bloque: "AFOROS", tecnicos: ["PATIMO"], radios: ["3212"], tablets: ["78"] },
      { id: 8, bloque: "BUQUE", tecnicos: ["PÉREZ"], radios: [""], tablets: ["2"] }
    ];
    localStorage.setItem("registros_bloques", JSON.stringify(defaultBloques));
    return defaultBloques;
  }
  return JSON.parse(data);
}

function saveBloques(data) {
  localStorage.setItem("registros_bloques", JSON.stringify(data));
}

function getStoredReefer() {
  const data = localStorage.getItem("reefer_team_data");
  if (data === null) {
    const defaultReefer = [
      { id: 1, personal: "DPW Ec", pedido: 7, asistieron: 7, observaciones: "" },
      { id: 2, personal: "Perú (12 hrs)", pedido: 2, asistieron: 2, observaciones: "" },
      { id: 3, personal: "Personal Coestibas", pedido: 5, asistieron: 5, observaciones: "" },
      { id: 4, personal: "Gate", pedido: 2, asistieron: 2, observaciones: "" },
      { id: 5, personal: "Proyecto", pedido: 2, asistieron: 2, observaciones: "" }
    ];
    localStorage.setItem("reefer_team_data", JSON.stringify(defaultReefer));
    return defaultReefer;
  }
  return JSON.parse(data);
}

function saveReefer(data) {
  localStorage.setItem("reefer_team_data", JSON.stringify(data));
}

// ==========================================
// LÓGICA DE BLOQUES
// ==========================================

function renderTableBloques() {
  const bloques = getStoredBloques();
  const tbody = document.getElementById("tbodyBloques");
  tbody.innerHTML = "";

  bloques.forEach(b => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${b.bloque}</strong></td>
      <td>${b.tecnicos.join(", ")}</td>
      <td>${b.radios.join(", ")}</td>
      <td>${b.tablets.join(", ")}</td>
      <td>
        <button class="action-btn btn-primary" onclick="editarBloque(${b.id})">Editar</button>
        <button class="action-btn btn-danger" onclick="eliminarBloque(${b.id})">Eliminar</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById("formBloques").addEventListener("submit", function(e) {
  e.preventDefault();
  const id = document.getElementById("bloqueId").value;
  const bloque = document.getElementById("bloqueNombre").value.trim();
  const tecnicos = document.getElementById("bloqueTecnicos").value.split(",").map(s => s.trim());
  const radios = document.getElementById("bloqueRadios").value.split(",").map(s => s.trim());
  const tablets = document.getElementById("bloqueTablets").value.split(",").map(s => s.trim());

  let list = getStoredBloques();

  if (id) {
    list = list.map(item => item.id == id ? { id: Number(id), bloque, tecnicos, radios, tablets } : item);
  } else {
    const newId = list.length > 0 ? Math.max(...list.map(i => i.id)) + 1 : 1;
    list.push({ id: newId, bloque, tecnicos, radios, tablets });
  }

  saveBloques(list);
  cancelarEdicionBloques();
  renderTableBloques();
});

function editarBloque(id) {
  const list = getStoredBloques();
  const item = list.find(i => i.id === id);
  if (item) {
    document.getElementById("bloqueId").value = item.id;
    document.getElementById("bloqueNombre").value = item.bloque;
    document.getElementById("bloqueTecnicos").value = item.tecnicos.join(", ");
    document.getElementById("bloqueRadios").value = item.radios.join(", ");
    document.getElementById("bloqueTablets").value = item.tablets.join(", ");
    document.getElementById("formBloquesTitle").innerText = "Editar Bloque";
  }
}

function eliminarBloque(id) {
  if (confirm("¿Desea eliminar este registro?")) {
    let list = getStoredBloques();
    list = list.filter(item => item.id !== id);
    saveBloques(list);
    renderTableBloques();
  }
}

function limpiarBloques() {
  if (confirm("¿Borrar todos los bloques?")) {
    saveBloques([]);
    cancelarEdicionBloques();
    renderTableBloques();
  }
}

function cancelarEdicionBloques() {
  document.getElementById("formBloques").reset();
  document.getElementById("bloqueId").value = "";
  document.getElementById("formBloquesTitle").innerText = "Agregar Bloque";
}

// ==========================================
// LÓGICA DE REEFER TEAM
// ==========================================

function renderReefer() {
  const reefer = getStoredReefer();
  const tbody = document.getElementById("tbodyReefer");
  tbody.innerHTML = "";

  reefer.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${r.personal}</strong></td>
      <td>${r.pedido}</td>
      <td>${r.asistieron}</td>
      <td>${r.observaciones || '-'}</td>
      <td>
        <button class="action-btn btn-primary" onclick="editarReefer(${r.id})">Editar</button>
        <button class="action-btn btn-danger" onclick="eliminarReefer(${r.id})">Eliminar</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById("formReefer").addEventListener("submit", function(e) {
  e.preventDefault();
  const id = document.getElementById("reeferId").value;
  const personal = document.getElementById("reeferPersonal").value.trim();
  const pedido = Number(document.getElementById("reeferPedido").value);
  const asistieron = Number(document.getElementById("reeferAsistieron").value);
  const observaciones = document.getElementById("reeferObservaciones").value.trim();

  let list = getStoredReefer();

  if (id) {
    list = list.map(item => item.id == id ? { id: Number(id), personal, pedido, asistieron, observaciones } : item);
  } else {
    const newId = list.length > 0 ? Math.max(...list.map(i => i.id)) + 1 : 1;
    list.push({ id: newId, personal, pedido, asistieron, observaciones });
  }

  saveReefer(list);
  cancelarEdicionReefer();
  renderReefer();
});

function editarReefer(id) {
  const list = getStoredReefer();
  const item = list.find(i => i.id === id);
  if (item) {
    document.getElementById("reeferId").value = item.id;
    document.getElementById("reeferPersonal").value = item.personal;
    document.getElementById("reeferPedido").value = item.pedido;
    document.getElementById("reeferAsistieron").value = item.asistieron;
    document.getElementById("reeferObservaciones").value = item.observaciones;
    document.getElementById("formReeferTitle").innerText = "Editar Personal";
  }
}

function eliminarReefer(id) {
  if (confirm("¿Desea eliminar este registro?")) {
    let list = getStoredReefer();
    list = list.filter(item => item.id !== id);
    saveReefer(list);
    renderReefer();
  }
}

function limpiarReefer() {
  if (confirm("¿Borrar todos los datos de equipo?")) {
    saveReefer([]);
    cancelarEdicionReefer();
    renderReefer();
  }
}

function cancelarEdicionReefer() {
  document.getElementById("formReefer").reset();
  document.getElementById("reeferId").value = "";
  document.getElementById("formReeferTitle").innerText = "Agregar Personal Reefer";
}

// Inicialización de la aplicación
document.addEventListener("DOMContentLoaded", () => {
  renderTableBloques();
  renderReefer();
});
</script>

</body>
</html>
