<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Asignación de Equipos y Bloques</title>
  <!-- Librería para descargar la tabla como imagen PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --navy-header: #002060;
      --blue-section: #5b9bd5;
      --border-color: #000000;
      --bg-light: #f4f7f9;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      background-color: var(--bg-light);
    }

    h1, h2 {
      text-align: center;
      color: #333;
      margin-top: 5px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .form-container {
      flex: 1;
      min-width: 300px;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 13px;
    }

    input, select, button {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button.btn-add {
      background-color: #28a745;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button.btn-cancel {
      background-color: #6c757d;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button.btn-clear {
      background-color: #dc3545;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .action-buttons-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    button.btn-report {
      background-color: #002060;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 5px;
      font-size: 14px;
      flex: 1;
      max-width: 250px;
    }

    button.btn-download {
      background-color: #17a2b8;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 5px;
      font-size: 14px;
      flex: 1;
      max-width: 250px;
    }

    .preview-container {
      flex: 1;
      min-width: 300px;
    }

    /* Tablas */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid var(--border-color);
      background-color: white;
      font-size: 12px;
    }

    .custom-table th {
      background-color: var(--navy-header);
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      padding: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .custom-table td {
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 5px;
      font-weight: bold;
    }

    .section-header {
      background-color: var(--blue-section);
      color: black;
      font-weight: bold;
      text-align: center;
    }

    .tech-name {
      text-transform: uppercase;
      text-align: center;
    }

    .highlight-pink {
      background-color: #fce4d6;
    }

    .actions-cell { width: 45px; }

    .btn-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 2px;
    }

    .btn-edit { color: #0056b3; }
    .btn-delete { color: red; }

    /* MODO REPORTE PANTALLA COMPLETA (Para Captura Móvil) */
    .fullscreen-report {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 9999;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    .fullscreen-report .custom-table {
      width: 100%;
      margin: 0 auto;
    }

    .fullscreen-hint {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>Control de Equipos por Bloque</h1>

  <div class="action-buttons-container">
    <button class="btn-report" onclick="mostrarReporteCaptura()">📱 Modo Captura (Pantalla Completa)</button>
    <button class="btn-download" onclick="descargarImagen()">📥 Descargar Reporte (PNG)</button>
  </div>

  <div class="container" id="mainLayout">
    <!-- FORMULARIO DE INGRESO -->
    <div class="form-container">
      <h2 id="formTitle">Ingresar Registro</h2>
      <form id="recordForm">
        <input type="hidden" id="editId" value="">

        <div class="form-group">
          <label for="bloque">Bloque / Zona:</label>
          <input type="text" id="bloque" placeholder="Ej: 1D, 1F, BUQ" required>
        </div>

        <div class="form-group">
          <label for="tecnicos">Técnico(s) (Separados por coma):</label>
          <input type="text" id="tecnicos" placeholder="Ej: TOCTO, TORRES" required>
        </div>

        <div class="form-group">
          <label for="radio">Radio(s) (Separadas por coma o una sola):</label>
          <input type="text" id="radio" placeholder="Ej: 4028, 1018 o solo 4012">
        </div>

        <div class="form-group">
          <label for="tablets">Tablet(s) por Técnico (Separadas por coma):</label>
          <input type="text" id="tablets" placeholder="Ej: 1, 11">
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-add" id="btnSubmit">Añadir Registro</button>
          <button type="button" class="btn-cancel" id="btnCancel" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
        </div>
        <button type="button" class="btn-clear" onclick="limpiarTodo()">Borrar Todos los Datos</button>
      </form>
    </div>

    <!-- PANEL DE EDICIÓN -->
    <div class="preview-container">
      <h2>Panel de Edición</h2>
      <table class="custom-table">
        <thead>
          <tr>
            <th style="width: 40%;">BLOQUES</th>
            <th style="width: 25%;">RADIO</th>
            <th style="width: 20%;">TABBLE</th>
            <th class="actions-cell">Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- VISTA EXCLUSIVA PARA CAPTURA (SÓLO LA TABLA FINAL) -->
  <div class="fullscreen-report" id="fullscreenReport" ondblclick="cerrarReporteCaptura()">
    <div class="fullscreen-hint">💡 Toca dos veces rápidas en la pantalla para regresar</div>
    <div id="captureTarget">
      <table class="custom-table">
        <thead>
          <tr>
            <th style="width: 45%;">BLOQUES</th>
            <th style="width: 30%;">RADIO</th>
            <th style="width: 25%;">TABBLE</th>
          </tr>
        </thead>
        <tbody id="captureReportBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", renderTable);

    const form = document.getElementById("recordForm");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const editId = document.getElementById("editId").value;
      const bloque = document.getElementById("bloque").value.trim();
      const tecnicosStr = document.getElementById("tecnicos").value.trim();
      const radioStr = document.getElementById("radio").value.trim();
      const tabletsStr = document.getElementById("tablets").value.trim();

      const tecnicos = tecnicosStr.split(',').map(t => t.trim()).filter(t => t !== "");
      const radios = radioStr ? radioStr.split(',').map(r => r.trim()) : [];
      const tablets = tabletsStr ? tabletsStr.split(',').map(t => t.trim()) : [];

      if (tecnicos.length === 0) return;

      let currentData = getStoredData();

      if (editId) {
        currentData = currentData.map(item => {
          if (item.id == editId) {
            return {
              id: Number(editId),
              bloque: bloque.toUpperCase(),
              tecnicos: tecnicos,
              radios: radios,
              tablets: tablets
            };
          }
          return item;
        });
        localStorage.setItem("registros_bloques", JSON.stringify(currentData));
        cancelarEdicion();
      } else {
        const newEntry = {
          id: Date.now(),
          bloque: bloque.toUpperCase(),
          tecnicos: tecnicos,
          radios: radios,
          tablets: tablets
        };
        currentData.push(newEntry);
        localStorage.setItem("registros_bloques", JSON.stringify(currentData));
        form.reset();
      }

      renderTable();
    });

    function getStoredData() {
      const data = localStorage.getItem("registros_bloques");
      return data ? JSON.parse(data) : getInitialData();
    }

    function cargarEdicion(id) {
      const data = getStoredData();
      const item = data.find(i => i.id == id);
      if (!item) return;

      document.getElementById("editId").value = item.id;
      document.getElementById("bloque").value = item.bloque;
      document.getElementById("tecnicos").value = item.tecnicos.join(", ");
      document.getElementById("radio").value = item.radios.join(", ");
      document.getElementById("tablets").value = item.tablets.join(", ");

      document.getElementById("formTitle").innerText = "Editar Registro";
      document.getElementById("btnSubmit").innerText = "Guardar Cambios";
      document.getElementById("btnCancel").style.display = "inline-block";
    }

    function cancelarEdicion() {
      document.getElementById("editId").value = "";
      form.reset();
      document.getElementById("formTitle").innerText = "Ingresar Registro";
      document.getElementById("btnSubmit").innerText = "Añadir Registro";
      document.getElementById("btnCancel").style.display = "none";
    }

    function deleteEntry(id) {
      if (confirm("¿Desea eliminar este registro?")) {
        let currentData = getStoredData();
        currentData = currentData.filter(item => item.id !== id);
        localStorage.setItem("registros_bloques", JSON.stringify(currentData));
        if (document.getElementById("editId").value == id) cancelarEdicion();
        renderTable();
      }
    }

    function limpiarTodo() {
      if (confirm("¿Está seguro de borrar todos los registros almacenados?")) {
        localStorage.removeItem("registros_bloques");
        cancelarEdicion();
        renderTable();
      }
    }

    function getInitialData() {
      return [
        { id: 1, bloque: "1D", tecnicos: ["TOMALA", "CHONILLO"], radios: ["4012"], tablets: ["5", "6"] },
        { id: 2, bloque: "1E", tecnicos: ["SOLANO", "MESA"], radios: ["4029"], tablets: ["9", "7"] },
        { id: 3, bloque: "1F", tecnicos: ["TOCTO", "TORRES"], radios: ["4028", "1018"], tablets: ["1", "11"] },
        { id: 4, bloque: "1G", tecnicos: ["TARIFEÑO", "PAREDES"], radios: ["LP"], tablets: ["13", "8"] },
        { id: 5, bloque: "1H", tecnicos: ["PACHAY", "TENORIO"], radios: ["4025"], tablets: ["10", "4"] },
        { id: 6, bloque: "1I", tecnicos: ["MINA", "SANCHEZ"], radios: ["4078"], tablets: ["12", "3"] },
        { id: 7, bloque: "AFOROS", tecnicos: ["FAJARDO"], radios: ["4071"], tablets: [""] },
        { id: 8, bloque: "BUQ", tecnicos: ["CEDEÑO", "GERRERO", "PIBAQUE"], radios: ["4015"], tablets: ["", "", ""] }
      ];
    }

    function renderTable() {
      const data = getStoredData();
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.forEach(group => {
        const rowCount = group.tecnicos.length;
        const hasMultipleRadios = Array.isArray(group.radios) && group.radios.length > 1;

        const headerRow = document.createElement("tr");
        headerRow.innerHTML = `<td colspan="4" class="section-header">${group.bloque}</td>`;
        tbody.appendChild(headerRow);

        group.tecnicos.forEach((tecnico, index) => {
          const row = document.createElement("tr");
          const isPink = group.bloque === "BUQ" && index < 2;
          const bgClass = isPink ? "highlight-pink" : "";

          let html = `<td class="tech-name ${bgClass}">${tecnico}</td>`;

          if (hasMultipleRadios) {
            const radVal = group.radios[index] !== undefined ? group.radios[index] : "";
            html += `<td>${radVal}</td>`;
          } else {
            if (index === 0) {
              const radVal = Array.isArray(group.radios) ? (group.radios[0] || "") : group.radios;
              html += `<td rowspan="${rowCount}" style="vertical-align: middle;">${radVal}</td>`;
            }
          }

          const tabVal = group.tablets[index] !== undefined ? group.tablets[index] : "";
          html += `<td>${tabVal}</td>`;

          if (index === 0) {
            html += `<td rowspan="${rowCount}" class="actions-cell" style="vertical-align: middle;">
                      <button class="btn-action btn-edit" onclick="cargarEdicion(${group.id})">✏️</button>
                      <button class="btn-action btn-delete" onclick="deleteEntry(${group.id})">✕</button>
                    </td>`;
          }

          row.innerHTML = html;
          tbody.appendChild(row);
        });
      });
    }

    // Renderiza la tabla limpia para la captura
    function buildCleanReport() {
      const data = getStoredData();
      const tbody = document.getElementById("captureReportBody");
      tbody.innerHTML = "";

      data.forEach(group => {
        const rowCount = group.tecnicos.length;
        const hasMultipleRadios = Array.isArray(group.radios) && group.radios.length > 1;

        const headerRow = document.createElement("tr");
        headerRow.innerHTML = `<td colspan="3" class="section-header">${group.bloque}</td>`;
        tbody.appendChild(headerRow);

        group.tecnicos.forEach((tecnico, index) => {
          const row = document.createElement("tr");
          const isPink = group.bloque === "BUQ" && index < 2;
          const bgClass = isPink ? "highlight-pink" : "";

          let html = `<td class="tech-name ${bgClass}">${tecnico}</td>`;

          if (hasMultipleRadios) {
            const radVal = group.radios[index] !== undefined ? group.radios[index] : "";
            html += `<td>${radVal}</td>`;
          } else {
            if (index === 0) {
              const radVal = Array.isArray(group.radios) ? (group.radios[0] || "") : group.radios;
              html += `<td rowspan="${rowCount}" style="vertical-align: middle;">${radVal}</td>`;
            }
          }

          const tabVal = group.tablets[index] !== undefined ? group.tablets[index] : "";
          html += `<td>${tabVal}</td>`;

          row.innerHTML = html;
          tbody.appendChild(row);
        });
      });
    }

    function mostrarReporteCaptura() {
      buildCleanReport();
      document.getElementById("fullscreenReport").style.display = "block";
    }

    function cerrarReporteCaptura() {
      document.getElementById("fullscreenReport").style.display = "none";
    }

    // Descargar el reporte como imagen PNG directamente
    function descargarImagen() {
      buildCleanReport();
      const container = document.getElementById("captureTarget");
      
      // Mostrar temporalmente fuera de pantalla para renderizarlo
      const reportDiv = document.getElementById("fullscreenReport");
      const wasHidden = reportDiv.style.display === "none" || reportDiv.style.display === "";
      if (wasHidden) {
        reportDiv.style.display = "block";
        reportDiv.style.opacity = "0";
      }

      html2canvas(container, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Reporte_Equipos_Bloques.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        if (wasHidden) {
          reportDiv.style.display = "none";
          reportDiv.style.opacity = "1";
        }
      });
    }
  </script>
</body>
</html>
