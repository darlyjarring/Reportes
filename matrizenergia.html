<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Energía Reefer 24H - Matriz 3x3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .cell-cold { background-color: #92D050 !important; font-weight: bold; color: #000; }
    .cell-red { background-color: #FF7676 !important; font-weight: bold; color: #fff; }
    .cell-normal { background-color: #F8FAFC; color: #334155; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div class="max-w-7xl mx-auto p-4 sm:p-6">
    
    <!-- Encabezado -->
    <header class="bg-sky-900 text-white rounded-lg p-6 shadow-md mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-center uppercase tracking-wide">
        Plan de Cambio de Energía - Bloques Reefer (24 Horas)
      </h1>
      <p class="text-center text-sky-200 text-sm mt-1">
        Fijación exclusiva de Unidades COLD (Columna F) | Matriz Visual 3x3 con Cupo Exacto de Bahías
      </p>
    </header>

    <!-- Panel de Control y Configuración -->
    <div class="bg-white rounded-lg p-6 shadow-sm mb-6 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <span>⚙️</span> Parámetros del Turno y Operación
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">HORA DE INICIO (CAMBIO)</label>
          <input type="time" id="inputHoraInicio" value="03:25" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">TOTAL BAHÍAS A DESCONECTAR</label>
          <input type="number" id="inputBahias" value="10" min="1" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">BLOQUES A AFECTAR POR HORA</label>
          <input type="number" id="inputBloques" value="2" min="1" max="6" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">BLOQUE DE INICIO (HORA 1)</label>
          <select id="inputInicioBloque" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none">
            <option value="0">1R (1D)</option>
            <option value="1">2R (1E)</option>
            <option value="2">3R (1F)</option>
            <option value="3">4R (1G)</option>
            <option value="4">5R (1H)</option>
            <option value="5">6R (1I)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">REPORTE REEFER (.XLSX)</label>
          <input type="file" id="fileExcel" accept=".xlsx, .xls" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-sky-100 file:text-sky-700 hover:file:bg-sky-200 cursor-pointer">
        </div>
      </div>

      <div class="flex flex-wrap gap-3 justify-end border-t border-slate-100 pt-4">
        <button id="btnProcesar" onclick="procesarReporte()" class="bg-sky-700 hover:bg-sky-800 text-white font-semibold py-2.5 px-6 rounded shadow transition-all text-sm flex items-center gap-2">
          <span>🚀</span> Generar Matriz 3x3 de 24H
        </button>
        <button id="btnExportar" onclick="exportarExcelPerfecto()" disabled class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-6 rounded shadow transition-all text-sm opacity-50 cursor-not-allowed flex items-center gap-2">
          <span>📥</span> Exportar Excel Ordenado (.xls)
        </button>
      </div>
    </div>

    <!-- Resumen de Lectura -->
    <div id="panelResumen" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg mb-6 text-sm">
      <span class="font-bold">Resumen de Procesamiento:</span> Se identificaron <span id="cantCold" class="font-bold text-emerald-900">0</span> bahías con unidades COLD en la Columna F, protegidas en verde.
    </div>

    <!-- Área de la Matriz 3x3 (24 Horas) -->
    <div id="contenedorMatriz" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <script>
    const bloquesBase = ["1R", "2R", "3R", "4R", "5R", "6R"];
    const bahiasBase = ["48", "52", "56", "60", "64", "68", "72", "76", "80", "84", "88", "92", "96"];

    function obtenerHorasCambioDinamicas() {
      const horaInput = document.getElementById("inputHoraInicio").value || "03:25";
      const [hStr, mStr] = horaInput.split(":");
      let horaBase = parseInt(hStr, 10);
      const minutoBase = parseInt(mStr, 10);
      const horasArr = [];

      for (let i = 0; i < 24; i++) {
        let hActual = (horaBase + i) % 24;
        let hFormat = String(hActual).padStart(2, '0');
        let mFormat = String(minutoBase).padStart(2, '0');
        horasArr.push(`${hFormat}:${mFormat}`);
      }
      return horasArr;
    }

    let mapaColdDetectadas = {};

    function parsearBloque(pos) {
      if (!pos) return "1R";
      const u = String(pos).toUpperCase();
      if (u.includes("1D")) return "1R";
      if (u.includes("1E")) return "2R";
      if (u.includes("1F")) return "3R";
      if (u.includes("1G")) return "4R";
      if (u.includes("1H")) return "5R";
      if (u.includes("1I")) return "6R";
      const partes = u.split("-");
      if (partes.length >= 3) {
        const blkStr = partes[2].substring(0, 2);
        if (blkStr === "1D") return "1R";
        if (blkStr === "1E") return "2R";
        if (blkStr === "1F") return "3R";
        if (blkStr === "1G") return "4R";
        if (blkStr === "1H") return "5R";
        if (blkStr === "1I") return "6R";
      }
      return "1R";
    }

    function parsearBahia(pos) {
      if (!pos) return "48";
      const u = String(pos).toUpperCase();
      for (let b of bahiasBase) {
        if (u.includes(b)) return b;
      }
      const partes = u.split("-");
      if (partes.length >= 3) {
        let sub = partes[2].replace(/[^0-9]/g, "");
        if (sub.length >= 4) {
          let bayNum = sub.substring(2, 4);
          if (bahiasBase.includes(bayNum)) return bayNum;
        }
      }
      return "48";
    }

    function procesarReporte() {
      const fileInput = document.getElementById("fileExcel");
      mapaColdDetectadas = {};

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });

          let colGrade = -1, colPos = -1;

          for (let r = 0; r < Math.min(15, rows.length); r++) {
            const row = rows[r];
            for (let c = 0; c < row.length; c++) {
              const val = String(row[c]).trim().toUpperCase();
              if (val === "GRADEID") colGrade = c;
              if (val === "POSITION") colPos = c;
            }
            if (colGrade !== -1 && colPos !== -1) break;
          }

          let contadorCold = 0;
          if (colGrade !== -1 && colPos !== -1) {
            for (let r = 0; r < rows.length; r++) {
              const gradeVal = String(rows[r][colGrade]).trim().toUpperCase();
              const posVal = String(rows[r][colPos]).trim();

              if (gradeVal === "COLD") {
                const blk = parsearBloque(posVal);
                const bay = parsearBahia(posVal);

                if (!mapaColdDetectadas[blk]) mapaColdDetectadas[blk] = {};
                if (!mapaColdDetectadas[blk][bay]) {
                  mapaColdDetectadas[blk][bay] = true;
                  contadorCold++;
                }
              }
            }
          }

          document.getElementById("cantCold").innerText = contadorCold;
          document.getElementById("panelResumen").classList.remove("hidden");
          generarMatrizHTML();
        };
        reader.readAsArrayBuffer(file);
      } else {
        generarMatrizHTML();
      }
    }

    function calcularBahiasApagarPorBloque(hIdx) {
      const totalBahiasApagar = parseInt(document.getElementById("inputBahias").value) || 10;
      const cantBloques = parseInt(document.getElementById("inputBloques").value) || 2;
      const bahiasPorBloque = Math.ceil(totalBahiasApagar / cantBloques);
      const ciclo3H = Math.floor(hIdx / 3) % 3;
      const bloquesActivos = obtenerBloquesActivos(hIdx);

      const apagadasPorBloque = {};

      Object.keys(bloquesActivos).forEach(blk => {
        const listaApagadas = {};
        let count = 0;

        for (let intento = 1; intento <= 2; intento++) {
          for (let bi = 0; bi < bahiasBase.length; bi++) {
            if (count >= bahiasPorBloque) break;

            let idxReal = bi;
            if (intento === 1) {
              if (ciclo3H === 0) idxReal = bi;
              else if (ciclo3H === 1) idxReal = bahiasBase.length - 1 - bi;
              else if (ciclo3H === 2) idxReal = (Math.floor(bahiasBase.length / 2) + bi) % bahiasBase.length;
            }

            const bay = bahiasBase[idxReal];
            if (!listaApagadas[bay]) {
              const esCold = mapaColdDetectadas[blk] && mapaColdDetectadas[blk][bay];
              if (!esCold) {
                let pasaZona = true;
                if (intento === 1) {
                  const numBay = parseInt(bay);
                  if (ciclo3H === 0 && (numBay < 48 || numBay > 68)) pasaZona = false;
                  else if (ciclo3H === 1 && (numBay < 76 || numBay > 96)) pasaZona = false;
                  else if (ciclo3H === 2 && (numBay < 64 || numBay > 84)) pasaZona = false;
                }

                if (pasaZona) {
                  listaApagadas[bay] = true;
                  count++;
                }
              }
            }
          }
          if (count >= bahiasPorBloque) break;
        }

        apagadasPorBloque[blk] = listaApagadas;
      });

      return apagadasPorBloque;
    }

    function generarMatrizHTML() {
      const contenedor = document.getElementById("contenedorMatriz");
      contenedor.innerHTML = "";
      const horasCambio = obtenerHorasCambioDinamicas();

      horasCambio.forEach((hora, hIdx) => {
        const bloquesActivos = obtenerBloquesActivos(hIdx);
        const apagadasPorBloque = calcularBahiasApagarPorBloque(hIdx);

        let htmlTabla = `
          <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden text-xs">
            <div class="bg-sky-800 text-white font-bold text-center py-2 text-sm uppercase border-b border-sky-900">
              HORA DE CAMBIO ${hora}
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-center border-collapse">
                <thead>
                  <tr class="bg-slate-200 text-sky-900 font-bold border-b border-slate-300">
                    ${bloquesBase.map(b => `<th class="py-1 px-1 border-r border-slate-300">${b}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
        `;

        bahiasBase.forEach(bay => {
          htmlTabla += `<tr>`;

          bloquesBase.forEach(blk => {
            const esCold = mapaColdDetectadas[blk] && mapaColdDetectadas[blk][bay];

            if (esCold) {
              htmlTabla += `<td class="py-1 border border-slate-200 cell-cold">${bay}</td>`;
            } else if (bloquesActivos[blk] && apagadasPorBloque[blk] && apagadasPorBloque[blk][bay]) {
              htmlTabla += `<td class="py-1 border border-slate-200 cell-red">${bay}</td>`;
            } else {
              htmlTabla += `<td class="py-1 border border-slate-200 cell-normal">${bay}</td>`;
            }
          });

          htmlTabla += `</tr>`;
        });

        htmlTabla += `
                </tbody>
              </table>
            </div>
            <div class="p-2.5 bg-slate-50 border-t border-slate-200 text-[11px] space-y-1">
              <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#FF7676] rounded-sm inline-block"></span> <span class="font-bold text-slate-700">COLOR ROJO: DESCONECTADAS</span></div>
              <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#92D050] rounded-sm inline-block"></span> <span class="font-bold text-slate-700">COLOR VERDE: UNIDADES COLD</span></div>
            </div>
          </div>
        `;
        contenedor.innerHTML += htmlTabla;
      });

      const btnExp = document.getElementById("btnExportar");
      btnExp.disabled = false;
      btnExp.classList.remove("opacity-50", "cursor-not-allowed");
    }

    function obtenerBloquesActivos(hIdx) {
      const cantBloques = parseInt(document.getElementById("inputBloques").value) || 2;
      const blkInicio = parseInt(document.getElementById("inputInicioBloque").value) || 0;
      const bloquesActivos = {};
      const offsetBloque = hIdx * cantBloques;
      for (let i = 0; i < cantBloques; i++) {
        const idxB = (blkInicio + offsetBloque + i) % 6;
        bloquesActivos[bloquesBase[idxB]] = true;
      }
      return bloquesActivos;
    }

    function exportarExcelPerfecto() {
      const horasCambio = obtenerHorasCambioDinamicas();
      let excelHTML = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
          <meta charset="UTF-8">
          <style>
            table { border-collapse: collapse; font-family: Arial, sans-serif; font-size: 10pt; }
            th { background-color: #1F4E79; color: #FFFFFF; font-weight: bold; text-align: center; border: 1px solid #000; padding: 6px; }
            td { text-align: center; border: 1px solid #D9D9D9; padding: 4px; font-weight: bold; width: 45px; }
            .col-green { background-color: #92D050; color: #000000; }
            .col-red { background-color: #FF7676; color: #FFFFFF; }
            .col-header-hora { background-color: #2F5597; color: #FFFFFF; font-size: 11pt; font-weight: bold; text-align: center; padding: 8px; }
            .col-header-blk { background-color: #D9E1F2; color: #1F4E79; font-weight: bold; text-align: center; padding: 6px; }
            .leyenda-rojo { background-color: #FF7676; color: #FFFFFF; font-weight: bold; text-align: left; padding: 5px; font-size: 9pt; }
            .leyenda-verde { background-color: #92D050; color: #000000; font-weight: bold; text-align: left; padding: 5px; font-size: 9pt; }
            .separador-col { width: 25px; border: none; background-color: #FFFFFF; }
          </style>
        </head>
        <body>
          <h2 style="font-family: Arial; color: #1F4E79;">PLAN DE CAMBIO DE ENERGÍA DE LOS BLOQUES REEFER (24 HORAS)</h2>
          <table>
      `;

      for (let hIdx = 0; hIdx < horasCambio.length; hIdx += 3) {
        excelHTML += `<tr>`;
        for (let t = 0; t < 3; t++) {
          if (hIdx + t < horasCambio.length) {
            excelHTML += `<td colspan="6" class="col-header-hora">HORA DE CAMBIO ${horasCambio[hIdx + t]}</td>`;
            if (t < 2) excelHTML += `<td class="separador-col"></td>`;
          }
        }
        excelHTML += `</tr>`;

        excelHTML += `<tr>`;
        for (let t = 0; t < 3; t++) {
          if (hIdx + t < horasCambio.length) {
            bloquesBase.forEach(b => {
              excelHTML += `<td class="col-header-blk">${b}</td>`;
            });
            if (t < 2) excelHTML += `<td class="separador-col"></td>`;
          }
        }
        excelHTML += `</tr>`;

        bahiasBase.forEach(bay => {
          excelHTML += `<tr>`;
          for (let t = 0; t < 3; t++) {
            const hActual = hIdx + t;
            if (hActual < horasCambio.length) {
              const bloquesActivos = obtenerBloquesActivos(hActual);
              const apagadasPorBloque = calcularBahiasApagarPorBloque(hActual);

              bloquesBase.forEach(blk => {
                const esCold = mapaColdDetectadas[blk] && mapaColdDetectadas[blk][bay];
                let estiloCelda = "";

                if (esCold) {
                  estiloCelda = "col-green";
                } else if (bloquesActivos[blk] && apagadasPorBloque[blk] && apagadasPorBloque[blk][bay]) {
                  estiloCelda = "col-red";
                }

                excelHTML += `<td class="${estiloCelda}">${bay}</td>`;
              });
              if (t < 2) excelHTML += `<td class="separador-col"></td>`;
            }
          }
          excelHTML += `</tr>`;
        });

        excelHTML += `<tr>`;
        for (let t = 0; t < 3; t++) {
          if (hIdx + t < horasCambio.length) {
            excelHTML += `<td colspan="6" class="leyenda-rojo">COLOR ROJO: DESCONECTADAS</td>`;
            if (t < 2) excelHTML += `<td class="separador-col"></td>`;
          }
        }
        excelHTML += `</tr>`;

        excelHTML += `<tr>`;
        for (let t = 0; t < 3; t++) {
          if (hIdx + t < horasCambio.length) {
            excelHTML += `<td colspan="6" class="leyenda-verde">COLOR VERDE: UNIDADES COLD</td>`;
            if (t < 2) excelHTML += `<td class="separador-col"></td>`;
          }
        }
        excelHTML += `</tr>`;

        excelHTML += `<tr><td colspan="20" style="border:none; height: 20px;"></td></tr>`;
      }

      excelHTML += `
          </table>
        </body>
        </html>
      `;

      const blob = new Blob([excelHTML], { type: 'application/vnd.ms-excel' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "Plan_Cambio_Energia_Reefer_Ordenado.xls";
      link.click();
    }
  </script>
</body>
</html>
