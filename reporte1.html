<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Reefer & Operaciones</title>
  <style>
    :root {
      --navy-blue: #002060;
      --header-blue: #5b9bd5;
      --bg-light: #f4f7f9;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA SUPERIOR DE NAVEGACIÓN (HEADER) */
    header {
      background-color: var(--navy-blue);
      color: white;
      padding: 12px 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* MENÚ DE SELECCIÓN (TAB BAR MÓVIL) */
    .nav-tabs {
      display: flex;
      background-color: #ffffff;
      border-bottom: 2px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: none;
      border: none;
      outline: none;
      font-size: 13px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--navy-blue);
      border-bottom-color: var(--navy-blue);
      background-color: #eef4fc;
    }

    /* CONTENEDOR DE PÁGINAS (IFRAMES) */
    .content-area {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO PRINCIPAL -->
  <header>
    <h1>Control Operativo Reefer</h1>
  </header>

  <!-- MENÚ DE NAVEGACIÓN PRINCIPAL -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('bloquesFrame', this)">
      📦 Equipos por Bloque
    </button>
    <button class="tab-btn" onclick="switchTab('reeferFrame', this)">
      👥 Equipo de Trabajo
    </button>
  </nav>

  <!-- ÁREA DE CARGA DE ARCHIVOS HTML -->
  <div class="content-area">
    <!-- Carga el archivo de asignación de bloques -->
    <iframe id="bloquesFrame" src="bloques.html" class="active"></iframe>
    <!-- Carga el archivo de programación diaria reefer -->
    <iframe id="reeferFrame" src="equipo_trabajo.html"></iframe>
  </div>

  <script>
    function switchTab(frameId, btnElement) {
      // 1. Ocultar todos los iframes
      const frames = document.querySelectorAll('iframe');
      frames.forEach(frame => frame.classList.remove('active'));

      // 2. Desactivar todos los botones del menú
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      // 3. Activar el iframe y el botón seleccionado
      document.getElementById(frameId).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
